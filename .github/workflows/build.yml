name: Test and build desktop viewers
on:
  workflow_dispatch:
  push:
    branches: [main, 'overhaul/**', 'complete/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Name the bridge by its source
        if: runner.os == 'Windows'
        shell: bash
        # The bridge's file name is its hash, and Wave asks to restart Rekordbox when that changes:
        # so the same bridge source must build the same bytes, whatever Wave release it ships in.
        run: echo "BRIDGE_VERSION=$(git rev-parse HEAD:native | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Build the Windows Rekordbox bridge
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /MT /EHsc /W4 /LD /Brepro /DWAVE_BRIDGE_VERSION=\"%BRIDGE_VERSION%\"
          native\win_bridge\wave_bridge_win.cpp /Fe:rb_waveform_core\data\wave-bridge.dll
          /link /Brepro user32.lib
      - name: Check the bridge exports OpenSSL's provider entry
        if: runner.os == 'Windows'
        shell: cmd
        run: dumpbin /exports rb_waveform_core\data\wave-bridge.dll | findstr OSSL_provider_init && del rb_waveform_core\data\wave-bridge.lib rb_waveform_core\data\wave-bridge.exp
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests -v
      - name: Windows high-DPI native full-screen acceptance
        if: runner.os == 'Windows'
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python -m unittest discover -s tests -p test_qt_app.py -v
      - name: Capture native interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_demo.py --out validation
      - uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.os }}
          path: validation/
      - run: python scripts/build_app.py
      - name: Package macOS app as a DMG
        if: runner.os == 'macOS'
        run: |
          name=$([ "$(uname -m)" = arm64 ] && echo AppleSilicon || echo Intel)
          mkdir dmg && cp -R "dist/Rekordbox Wave.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Rekordbox Wave" -srcfolder dmg -format UDZO "dist/Rekordbox-Wave-macOS-$name.dmg"
      - name: Name the Windows download
        if: runner.os == 'Windows'
        shell: bash
        run: cp "dist/Rekordbox Wave.exe" dist/Rekordbox-Wave-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: wave-bridge-dll
          path: rb_waveform_core/data/wave-bridge.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wave-${{ matrix.os }}
          path: |
            dist/Rekordbox-Wave-*.exe
            dist/*.dmg
          if-no-files-found: error
      - name: Smoke test packaged imports and entry point
        shell: python
        run: |
          import pathlib, subprocess, sys
          binary = pathlib.Path('dist/Rekordbox Wave.exe') if sys.platform == 'win32' else pathlib.Path('dist/Rekordbox Wave.app/Contents/MacOS/Rekordbox Wave')
          subprocess.run([str(binary.resolve()), '--help'], check=True, timeout=120)
          subprocess.run([str(binary.resolve()), '--demo', '--config', 'validation/smoke-profile.json', '--smoke-test', 'validation/packaged-native.png'], check=True, timeout=120)
          assert pathlib.Path('validation/packaged-native.png').stat().st_size > 1000
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-interface-${{ matrix.os }}
          path: validation/packaged-native.png
  release:
    # A pushed v* tag drafts a release with every download; publish it from GitHub after checking it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rekordbox-wave-*
          merge-multiple: true
          path: downloads
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          --title "Rekordbox Wave ${GITHUB_REF_NAME#v}" downloads/*
