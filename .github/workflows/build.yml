name: Test and build desktop viewers
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft a release with this tag (for example v2.5.0) from the commit this run builds'
        required: false
        default: ''
      publish_tag:
        description: 'Only publish the drafted release with this tag (for example v2.5.0); nothing is built'
        required: false
        default: ''
  push:
    branches: [main, 'overhaul/**', 'complete/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  publish:
    # Publishes a draft checked on GitHub: its tag is created at the commit the draft was built from,
    # and Wave's updater offers it from then on.
    if: startsWith(inputs.publish_tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish_tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{draft: .isDraft, files: [.assets[].name]}'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,url
  build:
    if: ${{ !startsWith(inputs.publish_tag, 'v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Name the bridge by its source
        if: runner.os == 'Windows'
        shell: bash
        # The bridge's file name is its hash, and Wave asks to restart Rekordbox when that changes:
        # so the same bridge source must build the same bytes, whatever Wave release it ships in.
        run: echo "BRIDGE_VERSION=$(git rev-parse HEAD:native | cut -c1-7)" >> "$GITHUB_ENV"
      - name: Build the Windows Rekordbox bridge
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /MT /EHsc /W4 /LD /Brepro /DWAVE_BRIDGE_VERSION=\"%BRIDGE_VERSION%\"
          native\win_bridge\wave_bridge_win.cpp /Fe:rb_waveform_core\data\wave-bridge.dll
          /link /Brepro user32.lib
      - name: Check the bridge exports OpenSSL's provider entry and Wave's attach entry
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          dumpbin /exports rb_waveform_core\data\wave-bridge.dll | findstr OSSL_provider_init &&
          dumpbin /exports rb_waveform_core\data\wave-bridge.dll | findstr wave_bridge_attach &&
          del rb_waveform_core\data\wave-bridge.lib rb_waveform_core\data\wave-bridge.exp
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests -v
      - name: Windows high-DPI native full-screen acceptance
        if: runner.os == 'Windows'
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python -m unittest discover -s tests -p test_qt_app.py -v
      - name: Capture native interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_demo.py --out validation
      - uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.os }}
          path: validation/
      - run: python scripts/build_app.py
      - name: Package macOS app as a DMG
        if: runner.os == 'macOS'
        run: |
          name=$([ "$(uname -m)" = arm64 ] && echo AppleSilicon || echo Intel)
          mkdir dmg && cp -R "dist/Rekordbox Wave.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Rekordbox Wave" -srcfolder dmg -format UDZO "dist/Rekordbox-Wave-macOS-$name.dmg"
      - name: Name the Windows download
        if: runner.os == 'Windows'
        shell: bash
        run: cp "dist/Rekordbox Wave.exe" dist/Rekordbox-Wave-Windows-x64.exe
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import rb_waveform_core; print(rb_waveform_core.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$version" installer\windows\RekordboxWave.iss
          if ($LASTEXITCODE) { throw "The installer did not build" }
      - name: Install, start and uninstall with the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\Rekordbox-Wave-Setup-Windows-x64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait
          $folder = "$env:LOCALAPPDATA\Programs\Rekordbox Wave"
          if (-not (Test-Path "$folder\Rekordbox Wave.exe")) { throw "Wave was not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Rekordbox Wave.lnk")) { throw "No Start menu shortcut" }
          $run = Start-Process "$folder\Rekordbox Wave.exe" -ArgumentList '--demo','--config','validation\installed-profile.json','--smoke-test','validation\installed.png' -Wait -PassThru
          if ($run.ExitCode) { throw "The installed Wave did not start" }
          Start-Process "$folder\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$folder\Rekordbox Wave.exe") { throw "Wave was not uninstalled" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: wave-bridge-dll
          path: rb_waveform_core/data/wave-bridge.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wave-${{ matrix.os }}
          path: |
            dist/Rekordbox-Wave-*.exe
            dist/*.dmg
          if-no-files-found: error
      - name: Smoke test packaged imports and entry point
        shell: python
        run: |
          import pathlib, subprocess, sys
          binary = pathlib.Path('dist/Rekordbox Wave.exe') if sys.platform == 'win32' else pathlib.Path('dist/Rekordbox Wave.app/Contents/MacOS/Rekordbox Wave')
          subprocess.run([str(binary.resolve()), '--help'], check=True, timeout=120)
          subprocess.run([str(binary.resolve()), '--demo', '--config', 'validation/smoke-profile.json', '--smoke-test', 'validation/packaged-native.png'], check=True, timeout=120)
          assert pathlib.Path('validation/packaged-native.png').stat().st_size > 1000
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-interface-${{ matrix.os }}
          path: validation/packaged-native.png
  app:
    # The C++ rewrite (app/). Windows: one static exe (Qt and SQLCipher from vcpkg, built once and cached).
    # macOS: Qt's universal frameworks with SQLCipher from vcpkg per architecture. Linux: tests only.
    if: ${{ !startsWith(inputs.publish_tag, 'v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-wave
          - os: macos-15
            triplet: arm64-osx-wave
            arch: arm64
          - os: macos-15-intel
            triplet: x64-osx-wave
            arch: x86_64
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_TAG: '2025.07.25'
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev ninja-build
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Windows'
        with:
          version: '6.8.3'
          cache: true
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch vcpkg
        if: runner.os != 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
      - uses: actions/cache@v4
        if: runner.os != 'Linux'
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_TAG }}-${{ hashFiles('app/vcpkg.json', 'app/triplets/*') }}
      - name: Build
        shell: bash
        run: |
          pip install ninja || true
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [ -n "${{ matrix.triplet }}" ]; then
            args+=("-DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
                   "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" "-DVCPKG_OVERLAY_TRIPLETS=$PWD/app/triplets")
          fi
          if [ -n "${{ matrix.arch }}" ]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
                   "-DVCPKG_INSTALL_OPTIONS=--allow-unsupported")
          fi
          cmake -S app -B app-build -G Ninja "${args[@]}"
          cmake --build app-build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir app-build --output-on-failure
      - name: Show vcpkg logs
        if: failure() && runner.os != 'Linux'
        shell: bash
        run: find "$RUNNER_TEMP/vcpkg/buildtrees" -name '*.log' -size +0 -newer app/vcpkg.json -exec tail -n 40 {} + 2>/dev/null | tail -n 400 || true
  release:
    # A pushed v* tag drafts a release with every download; publish it from GitHub after checking it.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rekordbox-wave-*
          merge-multiple: true
          path: downloads
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        # From a tag push the tag exists; from a manual run with release_tag, GitHub creates it at this commit.
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes
          --title "Rekordbox Wave ${TAG#v}" downloads/*
