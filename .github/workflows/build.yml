name: Test and build desktop viewers
on:
  workflow_dispatch:
  push:
    branches: [main, 'overhaul/**', 'complete/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the Windows Rekordbox bridge
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /MT /EHsc /W4 /LD /DWAVE_BRIDGE_VERSION=\"%GITHUB_SHA:~0,7%\"
          native\win_bridge\wave_bridge_win.cpp /Fe:rb_waveform_core\data\wave-bridge.dll
          /link user32.lib
      - name: Check the bridge exports OpenSSL's provider entry
        if: runner.os == 'Windows'
        shell: cmd
        run: dumpbin /exports rb_waveform_core\data\wave-bridge.dll | findstr OSSL_provider_init
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests -v
      - name: Windows high-DPI native full-screen acceptance
        if: runner.os == 'Windows'
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python -m unittest discover -s tests -p test_qt_app.py -v
      - name: Capture native interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_demo.py --out validation
      - uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.os }}
          path: validation/
      - run: python scripts/build_app.py
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Rekordbox Wave.app" "dist/Rekordbox-Wave-${{ matrix.os }}.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: wave-bridge-dll
          path: rb_waveform_core/data/wave-bridge.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-wave-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - name: Smoke test packaged imports and entry point
        shell: python
        run: |
          import pathlib, subprocess, sys
          binary = pathlib.Path('dist/Rekordbox Wave.exe') if sys.platform == 'win32' else pathlib.Path('dist/Rekordbox Wave.app/Contents/MacOS/Rekordbox Wave')
          subprocess.run([str(binary.resolve()), '--help'], check=True, timeout=120)
          subprocess.run([str(binary.resolve()), '--demo', '--config', 'validation/smoke-profile.json', '--smoke-test', 'validation/packaged-native.png'], check=True, timeout=120)
          assert pathlib.Path('validation/packaged-native.png').stat().st_size > 1000
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-interface-${{ matrix.os }}
          path: validation/packaged-native.png
