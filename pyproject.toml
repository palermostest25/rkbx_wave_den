[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rkbx_wave"
version = "1.2.0"
description = "Real-time, zoomable multi-deck waveform display for Rekordbox (reads Rekordbox memory directly)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "mrmilbe"}
]
keywords = ["rekordbox", "dj", "waveform", "pioneer", "cdj"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pygame>=2.6.0",
    "pymem>=1.13; sys_platform == 'win32'",
    "screeninfo>=0.8.1",
    "psutil>=5.9.0",
    "pyrekordbox>=0.4.0",
    "python-osc>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/palermostest25/rkbx_wave_den"
Repository = "https://github.com/palermostest25/rkbx_wave_den"

[project.scripts]
rkbx_wave = "rkbx_wave:main"

[tool.setuptools]
py-modules = ["rkbx_wave"]
packages = ["rb_waveform_core"]

[tool.setuptools.package-data]
# Ship the version-keyed memory offsets and the default config with the wheel.
rb_waveform_core = ["data/offsets", "data/default_config.json"]
